; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; This board's panel was confirmed ILI9341 on 2026-09-17 (ST7789 stays white).
default_envs = cyd-ili9341

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
lib_deps = 
	https://github.com/lvgl/lvgl.git#v9.5.0
	https://github.com/lovyan03/LovyanGFX.git#1.2.25
	https://github.com/bblanchon/ArduinoJson.git#v7.4.2
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	https://github.com/bitbank2/PNGdec.git
build_flags = 
	-D LV_CONF_SKIP
	-D LV_COLOR_DEPTH=16
	-D LV_USE_LOG=1
	-D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_18=1
	-D LV_FONT_MONTSERRAT_24=1
	-D LV_FONT_MONTSERRAT_48=1
	-D CORE_DEBUG_LEVEL=1

[env:cyd-st7789]
build_flags =
	${env.build_flags}
	-D WORDMON_PANEL_ST7789=1
	-D WORDMON_PANEL_NAME=\"ST7789\"

[env:cyd-ili9341]
build_flags = 
	${env.build_flags}
	-D WORDMON_PANEL_ILI9341=1
	-D WORDMON_PANEL_NAME=\"ILI9341\"
